# Main CI workflow: build, publish Docker image, and deploy
name: Build, Publish & Deploy

on:
  push:
    branches: [ "main", "test", "dev" ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum

      - name: Configure private module access
        run: git config --global url."https://${{ secrets.GH_PRIVATE_PKG_PAT }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download

      - name: Cache protoc binary
        id: cache-protoc
        uses: actions/cache@v4
        with:
          path: ~/protoc
          key: protoc-29.3-${{ runner.os }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/protoc
          curl -Lo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          unzip /tmp/protoc.zip -d ~/protoc
          rm /tmp/protoc.zip

      - name: Add protoc to PATH
        run: echo "$HOME/protoc/bin" >> $GITHUB_PATH

      - name: Cache Go tools
        id: cache-go-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-tools-${{ runner.os }}-

      - name: Install Go protoc plugins
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0

      - name: Generate code
        run: make generate

      - name: Run tests
        run: make test

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Get short commit SHA
        id: get_sha
        run: echo "GIT_SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Prepare GitHub token for BuildKit
        run: echo "${{ secrets.GH_PRIVATE_PKG_PAT }}" > .gh_token
      - name: Build and push Docker images
        id: build-and-push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.GIT_SHORT_SHA }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            gh_token=.gh_token
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make package private
        run: |
          PACKAGE_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/user/packages/container/$PACKAGE_NAME" \
            -d '{"visibility":"private"}'

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: build-and-push
    environment: ${{ github.ref_name }}
    steps:
      - name: Update state repo
        uses: pieceowater-dev/lotof.cloud.ci/.github/actions/update-state@main
        with:
          repo-name: ${{ github.event.repository.name }}
          commit-sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          ssh-key: ${{ secrets.STATE_REPO_SSH_KEY }}
